{% extends 'base.html' %}
{% block title %}Jinja2 с данными - Лаб 6{% endblock %}
{% block content %}
<h2 class="mb-3">Задание 9: Шаблон Jinja2 с данными</h2>
<div class="row">
    {% for course in courses %}
    <div class="col-md-4 mb-3">
        <div class="card custom-card h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="card-title mb-0">{{ course.title }}</h5>
                    <span class="badge badge-custom">{{ course.level }}</span>
                </div>
                <p class="card-text text-muted">{{ course.description }}</p>
            </div>
            <div class="card-footer bg-transparent border-0">
                <small class="text-success fw-semibold">Часов: {{ course.hours }}</small>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
